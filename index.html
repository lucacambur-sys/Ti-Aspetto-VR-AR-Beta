      <a-cursor></a-cursor>
    </a-camera>
  </a-entity>

  <script>
    AFRAME.registerComponent('gyro-stand', {
      init: function() {
        const rig = document.querySelector('#cameraRig');
        let baseY = 1.2;
        
        this.el.sceneEl.addEventListener('deviceorientation', (e) => {
          const beta = e.detail.beta || 0;
          const tiltFactor = Math.max(-30, Math.min(30, beta));
          const deltaY = (tiltFactor / 30) * 0.8;
          
          rig.setAttribute('position', {
            x: 0,
            y: baseY + deltaY,
            z: 2
          });
        });
      }
    });
    
    document.querySelector('a-scene').setAttribute('gyro-stand', '');
  </script>

      const btn = document.querySelector('#playBtn');
