<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Virtuale Realistico</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            position: relative;
        }
        
        .cinema-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            letter-spacing: 3px;
        }
        
        .cinema-room {
            width: 100%;
            height: 750px;
            background: linear-gradient(to bottom, #111 0%, #000 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            transition: background-color 2s ease;
        }
        
        /* Schermo cinema */
        .screen-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 1918px;
            height: 910px;
            max-width: 95%;
            max-height: 500px;
            perspective: 1000px;
        }
        
        .screen {
            width: 100%;
            height: 100%;
            background-color: #000;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.1);
            transform: rotateX(5deg);
            border: 15px solid #222;
        }
        
        .screen-content {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a1a1a, #000);
        }
        
        .screen-play-btn {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            z-index: 10;
        }
        
        .screen-play-btn:hover {
            background-color: #ffd633;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.8);
        }
        
        .screen-text {
            font-size: 1.8rem;
            margin-top: 20px;
            color: #ffcc00;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }
        
        /* Illuminazione ambientale */
        .ambient-light {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(255, 204, 0, 0.15) 0%, transparent 70%);
            transition: opacity 2s ease;
            pointer-events: none;
        }
        
        .side-lights {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .side-light {
            position: absolute;
            top: 0;
            width: 30px;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 204, 0, 0.2), transparent);
        }
        
        .side-light.left {
            left: 0;
        }
        
        .side-light.right {
            right: 0;
            transform: rotate(180deg);
        }
        
        /* Posti a sedere e persone */
        .seating-area {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 40px;
        }
        
        .seats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .seat {
            width: 40px;
            height: 50px;
            background-color: #333;
            border-radius: 8px 8px 4px 4px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .seat.person {
            background-color: #555;
        }
        
        .seat-head {
            width: 30px;
            height: 30px;
            background-color: #444;
            border-radius: 50%;
            position: absolute;
            top: -20px;
            left: 5px;
        }
        
        .seat.person .seat-head {
            background-color: #c19a6b; /* Colore pelle */
        }
        
        /* Persone realistiche */
        .person-1 .seat-head {
            background-color: #d4b59e;
            width: 28px;
            height: 28px;
        }
        
        .person-2 .seat-head {
            background-color: #a67c52;
            width: 32px;
            height: 32px;
        }
        
        .person-3 .seat-head {
            background-color: #e6c19c;
            width: 26px;
            height: 26px;
        }
        
        .person-4 .seat-head {
            background-color: #8b6b47;
            width: 30px;
            height: 30px;
        }
        
        /* Controlli */
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .control-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .control-btn:hover {
            background-color: #444;
            transform: translateY(-3px);
        }
        
        .control-btn i {
            font-size: 1.2rem;
        }
        
        .lights-on {
            background-color: #ffcc00;
            color: #000;
        }
        
        .instructions {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 1.1rem;
        }
        
        /* Stato luci spente */
        .lights-off .cinema-room {
            background-color: #000;
        }
        
        .lights-off .ambient-light {
            opacity: 0.05;
        }
        
        .lights-off .side-light {
            opacity: 0.1;
        }
        
        .lights-off .seat {
            background-color: #222;
        }
        
        .lights-off .seat.person {
            background-color: #333;
        }
        
        /* Video player */
        .video-player {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: cover;
        }
        
        .video-player.active {
            display: block;
        }
        
        /* Effetti luce */
        .light-effect {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        
        .projector-light {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 20px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.8), transparent);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 2;
        }
        
        .lights-off .projector-light {
            opacity: 0.3;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .screen-container {
                max-width: 90%;
            }
            
            .cinema-room {
                height: 700px;
            }
        }
        
        @media (max-width: 768px) {
            .cinema-room {
                height: 600px;
            }
            
            .seating-area {
                height: 200px;
            }
            
            .seat {
                width: 30px;
                height: 40px;
            }
            
            .seat-head {
                width: 24px;
                height: 24px;
                top: -15px;
            }
            
            .screen-text {
                font-size: 1.4rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1 class="cinema-title">CINEMA VIRTUALE 1918x910</h1>
        
        <div class="cinema-room" id="cinemaRoom">
            <!-- Effetti luce -->
            <div class="ambient-light" id="ambientLight"></div>
            <div class="side-lights">
                <div class="side-light left"></div>
                <div class="side-light right"></div>
            </div>
            
            <!-- Luce proiettore -->
            <div class="projector-light" id="projectorLight"></div>
            
            <!-- Schermo cinema -->
            <div class="screen-container">
                <div class="screen">
                    <div class="screen-content" id="screenContent">
                        <button class="screen-play-btn" id="playButton">
                            <i class="fas fa-play"></i> PLAY FILM
                        </button>
                        <p class="screen-text">Premi PLAY per iniziare l'esperienza cinematografica</p>
                    </div>
                    <video class="video-player" id="videoPlayer" controls>
                        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                        Il tuo browser non supporta il tag video.
                    </video>
                </div>
            </div>
            
            <!-- Posti a sedere con persone -->
            <div class="seating-area" id="seatingArea">
                <!-- Le sedie con persone verranno generate via JavaScript -->
            </div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="lightsButton">
                <i class="fas fa-lightbulb"></i> LUCI AMBIENTALI
            </button>
            <button class="control-btn" id="resetButton">
                <i class="fas fa-redo"></i> RESET
            </button>
        </div>
        
        <p class="instructions">Premi PLAY sullo schermo per spegnere le luci e iniziare il film. Usa i controlli per gestire le luci.</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elementi DOM
            const cinemaRoom = document.getElementById('cinemaRoom');
            const playButton = document.getElementById('playButton');
            const videoPlayer = document.getElementById('videoPlayer');
            const screenContent = document.getElementById('screenContent');
            const ambientLight = document.getElementById('ambientLight');
            const projectorLight = document.getElementById('projectorLight');
            const seatingArea = document.getElementById('seatingArea');
            const lightsButton = document.getElementById('lightsButton');
            const resetButton = document.getElementById('resetButton');
            
            // Stato delle luci
            let lightsOn = true;
            
            // Genera posti a sedere con persone
            function generateSeats() {
                const rows = 5;
                const seatsPerRow = 12;
                
                for (let row = 0; row < rows; row++) {
                    const seatsRow = document.createElement('div');
                    seatsRow.className = 'seats-row';
                    
                    for (let seatNum = 0; seatNum < seatsPerRow; seatNum++) {
                        const seat = document.createElement('div');
                        seat.className = 'seat';
                        
                        // Aggiungi una persona casualmente (70% di probabilità)
                        if (Math.random() > 0.3) {
                            seat.classList.add('person');
                            // Assegna una classe persona casuale per diversità
                            const personType = Math.floor(Math.random() * 4) + 1;
                            seat.classList.add(`person-${personType}`);
                            
                            // Aggiungi testa alla persona
                            const seatHead = document.createElement('div');
                            seatHead.className = 'seat-head';
                            seat.appendChild(seatHead);
                        }
                        
                        seatsRow.appendChild(seat);
                    }
                    
                    seatingArea.appendChild(seatsRow);
                }
            }
            
            // Genera effetti luce dinamici
            function createLightEffects() {
                // Rimuovi effetti luce esistenti
                const existingLights = document.querySelectorAll('.light-effect');
                existingLights.forEach(light => light.remove());
                
                // Crea nuovi effetti luce
                const lightCount = 15;
                for (let i = 0; i < lightCount; i++) {
                    const light = document.createElement('div');
                    light.className = 'light-effect';
                    
                    // Posizione casuale
                    const xPos = Math.random() * 100;
                    const yPos = Math.random() * 100;
                    
                    // Dimensioni casuali
                    const size = Math.random() * 80 + 20;
                    
                    // Colori caldi casuali
                    const colors = [
                        'rgba(255, 204, 0, 0.1)',
                        'rgba(255, 153, 0, 0.08)',
                        'rgba(255, 102, 0, 0.06)',
                        'rgba(255, 204, 102, 0.12)'
                    ];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Applica stili
                    light.style.width = `${size}px`;
                    light.style.height = `${size}px`;
                    light.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
                    light.style.left = `${xPos}%`;
                    light.style.top = `${yPos}%`;
                    light.style.opacity = '0.7';
                    
                    // Animazione leggera
                    light.style.animation = `pulse ${Math.random() * 5 + 3}s infinite alternate`;
                    
                    cinemaRoom.appendChild(light);
                }
                
                // Aggiungi keyframes per l'animazione
                const styleSheet = document.createElement('style');
                styleSheet.textContent = `
                    @keyframes pulse {
                        0% { opacity: 0.5; transform: scale(1); }
                        100% { opacity: 0.9; transform: scale(1.1); }
                    }
                `;
                document.head.appendChild(styleSheet);
            }
            
            // Accendi/spegni luci
            function toggleLights() {
                lightsOn = !lightsOn;
                
                if (lightsOn) {
                    cinemaRoom.classList.remove('lights-off');
                    lightsButton.innerHTML = '<i class="fas fa-lightbulb"></i> LUCI AMBIENTALI';
                    lightsButton.classList.add('lights-on');
                    
                    // Mostra il contenuto dello schermo se il video non è in riproduzione
                    if (videoPlayer.paused) {
                        screenContent.style.display = 'flex';
                        videoPlayer.classList.remove('active');
                    }
                } else {
                    cinemaRoom.classList.add('lights-off');
                    lightsButton.innerHTML = '<i class="fas fa-moon"></i> LUCI SPENTE';
                    lightsButton.classList.remove('lights-on');
                }
            }
            
            // Riproduci video
            function playVideo() {
                // Spegni le luci
                if (lightsOn) {
                    toggleLights();
                }
                
                // Nascondi il contenuto dello schermo e mostra il video
                screenContent.style.display = 'none';
                videoPlayer.classList.add('active');
                
                // Riproduci il video
                videoPlayer.play();
                
                // Aggiorna il testo del pulsante luci
                lightsButton.innerHTML = '<i class="fas fa-moon"></i> LUCI SPENTE';
                lightsButton.classList.remove('lights-on');
            }
            
            // Reset cinema
            function resetCinema() {
                // Ferma il video
                videoPlayer.pause();
                videoPlayer.currentTime = 0;
                videoPlayer.classList.remove('active');
                
                // Mostra il contenuto dello schermo
                screenContent.style.display = 'flex';
                
                // Accendi le luci
                if (!lightsOn) {
                    toggleLights();
                }
            }
            
            // Gestione eventi
            playButton.addEventListener('click', playVideo);
            lightsButton.addEventListener('click', toggleLights);
            resetButton.addEventListener('click', resetCinema);
            
            // Quando il video termina
            videoPlayer.addEventListener('ended', function() {
                // Torna allo stato iniziale dopo 3 secondi
                setTimeout(resetCinema, 3000);
            });
            
            // Inizializzazione
            generateSeats();
            createLightEffects();
            
            // Pulsante luci inizialmente evidenziato
            lightsButton.classList.add('lights-on');
            
            // Effetto di luce dinamica sulle persone
            setInterval(() => {
                const persons = document.querySelectorAll('.seat.person');
                persons.forEach(person => {
                    // Leggera variazione di colore casuale
                    if (Math.random() > 0.7 && lightsOn) {
                        person.style.backgroundColor = `hsl(40, ${Math.random() * 20 + 20}%, ${Math.random() * 10 + 25}%)`;
                        
                        // Torna al colore originale dopo un po'
                        setTimeout(() => {
                            person.style.backgroundColor = '';
                        }, 500);
                    }
                });
            }, 1000);
        });
    </script>
</body>
</html>
