<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Cinema VR Realistico</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    .instructions {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      z-index: 1000;
      font-family: Arial, sans-serif;
    }
  </style>
</head>

<body>
  <div class="instructions">
    <strong>Istruzioni:</strong><br>
    • Clicca PLAY per iniziare il film<br>
    • Le luci si spegneranno automaticamente<br>
    • Muovi il mouse per guardarti intorno<br>
    • Usa la rotellina per zoom
  </div>

    <a-text value="Cinema VR Realistico" position="11 3 -14.89" align="center" color="#ffffff" width="6" rotation="0 0 0"></a-text>

    </a-entity>

    <!-- Persona su poltrona -2 fila davanti -->

      <a-sphere position="0 1.2 0" radius="0.25" color="#FFE4B5"></a-sphere>
      <a-box position="0 1.35 0.15" width="0.5" height="0.1" depth="0.3" color="#000000"></a-box>

    <a-light id="mainLight1" type="point" position="0 6.5 -14" intensity="1.0" color="#FFFFFF"></a-light>
    <a-light id="mainLight2" type="point" position="-10 6.5 0" intensity="0.8" color="#FFCC00"></a-light>
    <a-light id="mainLight3" type="point" position="10 6.5 0" intensity="0.8" color="#FFCC00"></a-light>
    <a-light id="sideLight1" type="point" position="-15 6.5 0" intensity="0.6" color="#FF9900"></a-light>
    <a-light id="sideLight2" type="point" position="15 6.5 0" intensity="0.6" color="#FF9900"></a-light>
    <a-light id="frontLight1" type="point" position="-10 6.5 -10" intensity="0.7" color="#FFDD55"></a-light>
    <a-light id="frontLight2" type="point" position="10 6.5 -10" intensity="0.7" color="#FFDD55"></a-light>
    
    <!-- Luce del proiettore (inizialmente spenta) -->
    <a-light id="projectorLight" type="spot" position="0 6.5 -13" target="#screen" angle="30" penumbra="0.5" intensity="0" color="#FFFFFF"></a-light>

    <!-- CAMERA -->
    <a-entity position="0 1.2 2">
      <a-camera look-controls="magicWindowTrackingEnabled: true">
        <a-cursor></a-cursor>
      </a-camera>
    </a-entity>

    <!-- PLAY BUTTON -->
    <a-plane
      id="playBtn"
      position="0 1.6 0.8"
      width="2.5"
      height="1.0"
      color="#FF0000"
      material="shader: flat; side: double"
      text="value: ▶ PLAY FILM; align: center; color: white; width: 6"
      animation__hover="property: scale; from: 1 1 1; to: 1.1 1.1 1; dur: 200; startEvents: mouseenter"
      animation__hoverout="property: scale; from: 1.1 1.1 1; to: 1 1 1; dur: 200; startEvents: mouseleave"
    >
    </a-plane>

    <!-- SCRITTA "Premi PLAY" -->
    <a-text 
      value="Premi PLAY per iniziare lo spettacolo" 
      position="0 0.8 0.8" 
      align="center" 
      color="#FFCC00" 
      width="8"
      opacity="0.8"
    ></a-text>

  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const playBtn = document.querySelector('#playBtn');
      const video = document.querySelector('#movie');
      const screen = document.querySelector('#screen');
      const projectorLight = document.querySelector('#projectorLight');
      
      // Lista di tutte le luci da spegnere
      const lights = [
        '#ambientLight',
        '#mainLight1', '#mainLight2', '#mainLight3',
        '#sideLight1', '#sideLight2',
        '#frontLight1', '#frontLight2'
      ];
      
      // Stato delle luci
      let lightsOn = true;
      
      // Funzione per spegnere le luci
      function turnOffLights() {
        lights.forEach(lightId => {
          const light = document.querySelector(lightId);
          if (light) {
            // Animazione per spegnimento graduale
            light.setAttribute('animation', {
              property: 'intensity',
              from: light.getAttribute('intensity'),
              to: 0.1,
              dur: 2000,
              easing: 'easeOutQuad'
            });
            light.setAttribute('intensity', 0.1);
          }
        });
        
        // Accendi la luce del proiettore
        projectorLight.setAttribute('animation', {
          property: 'intensity',
          from: 0,
          to: 0.8,
          dur: 2000,
          easing: 'easeInQuad'
        });
        projectorLight.setAttribute('intensity', 0.8);
        
        lightsOn = false;
      }
      
      // Funzione per riaccendere le luci
      function turnOnLights() {
        lights.forEach(lightId => {
          const light = document.querySelector(lightId);
          if (light) {
            // Riaccendi le luci gradualmente
            light.setAttribute('animation', {
              property: 'intensity',
              from: 0.1,
              to: lightId === '#ambientLight' ? 0.6 : 
                  lightId.includes('main') ? 1.0 : 
                  lightId.includes('side') ? 0.6 : 
                  lightId.includes('front') ? 0.7 : 0.8,
              dur: 2000,
              easing: 'easeInQuad'
            });
            
            if (lightId === '#ambientLight') {
              light.setAttribute('intensity', 0.6);
            } else if (lightId.includes('main')) {
              light.setAttribute('intensity', 1.0);
            } else if (lightId.includes('side')) {
              light.setAttribute('intensity', 0.6);
            } else if (lightId.includes('front')) {
              light.setAttribute('intensity', 0.7);
            }
          }
        });
        
        // Spegni la luce del proiettore
        projectorLight.setAttribute('animation', {
          property: 'intensity',
          from: 0.8,
          to: 0,
          dur: 1000,
          easing: 'easeOutQuad'
        });
        projectorLight.setAttribute('intensity', 0);
        
        lightsOn = true;
      }
      
      // Event listener per il click sul pulsante PLAY
      playBtn.addEventListener('click', function() {
        // Nascondi il pulsante
        playBtn.setAttribute('visible', 'false');
        
        // Spegni le luci gradualmente
        turnOffLights();
        
        // Avvia il video dopo un breve ritardo per sincronizzarsi con lo spegnimento luci
        setTimeout(() => {
          video.play();
        }, 1000);
        
        // Nascondi anche la scritta
        const instructionText = document.querySelector('[value="Premi PLAY per iniziare lo spettacolo"]');
        if (instructionText) {
          instructionText.parentNode.removeChild(instructionText);
        }
      });
      
      // Quando il video finisce, riaccendi le luci
      video.addEventListener('ended', function() {
        turnOnLights();
        // Mostra nuovamente il pulsante play
        playBtn.setAttribute('visible', 'true');
      });
      
      // Anche se l'utente mette in pausa, riaccendi le luci
      video.addEventListener('pause', function() {
        if (!lightsOn) {
          turnOnLights();
          playBtn.setAttribute('visible', 'true');
        }
      });
    });
  </script>
</body>
</html>
