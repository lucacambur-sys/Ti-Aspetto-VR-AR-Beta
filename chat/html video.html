  <a-box position="7 0.85 10.05" width="1.2" height="0.8" depth="0.2" color="#8b0000"></a-box>
  <a-box position="6.5 0.7 9.8" width="0.15" height="0.6" depth="0.6" color="#6f0000"></a-box>
  <a-box position="7.5 0.7 9.8" width="0.15" height="0.6" depth="0.6" color="#6f0000"></a-box>

  <!-- LUCI AMBIENTALI -->
  <a-light type="ambient" intensity="0.3" color="#1a1a2a"></a-light>
  <a-light type="point" position="0 6.5 -14" intensity="0.5" color="#ffffff"></a-light>

  <!-- CAMERA (SEDUTO + GIROSCOPIO) -->
  <a-entity position="0 1.2 2">
    <a-camera look-controls="magicWindowTrackingEnabled: true">
      <a-cursor></a-cursor>
    </a-camera>
  </a-entity>

  <!-- PLAY BUTTON -->
  <a-plane
    id="playBtn"
    position="0 1.6 0.8"
    width="1.8"
    height="0.7"
    color="#b30000"
    text="value: ▶ PLAY; align: center; color: white; width: 4"
    onclick="
      const video = document.querySelector('#movie');
      const btn = document.querySelector('#playBtn');
      video.play();
      btn.setAttribute('visible','false');
    "
  ></a-plane>

</a-scene>
</body>
</html>
